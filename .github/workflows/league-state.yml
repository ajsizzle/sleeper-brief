name: league-state

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. These are 7:15 am, 11:15 am, and 6:45 pm Eastern
    # during daylight time, about 45 minutes ahead of each brief run.
    # After clocks change on Nov 1 they land an hour earlier in ET,
    # which is still ahead of the brief, so no edit is needed.
    - cron: "15 11 * * *"
    - cron: "15 15 * * *"
    - cron: "45 22 * * *"

permissions:
  contents: write

concurrency:
  group: league-state
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests (leak checks included)
        run: python -m unittest -v

      - name: Pull league state from Sleeper
        # Stored as secrets, not variables, so GitHub masks them in the
        # public workflow logs.
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          SLEEPER_USERNAME: ${{ secrets.SLEEPER_USERNAME }}
        run: python sleeper_brief.py

      - name: Leak scan of generated files
        # Second, independent guard. The script already refuses to write
        # identifiers; this step fails the job if anything slipped through.
        # Secret values are masked by GitHub if they ever print.
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          SLEEPER_USERNAME: ${{ secrets.SLEEPER_USERNAME }}
        run: |
          set -e
          for f in league.md league.json players_trim.json; do
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
            if grep -qF -- "$LEAGUE_ID" "$f"; then echo "league id found in $f"; exit 1; fi
            if grep -qiF -- "$SLEEPER_USERNAME" "$f"; then echo "username found in $f"; exit 1; fi
            if grep -qE '[0-9]{15,}' "$f"; then echo "long numeric id found in $f"; exit 1; fi
          done
          echo "leak scan clean"

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add league.md league.json players_trim.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "league state $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
